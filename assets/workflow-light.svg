<rect x="1072" y="294.5" width="10" height="10" rx="2" fill="#cf222e"/>
<text x="1088" y="304.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="normal" font-style="normal" text-anchor="start">3 failed</text>
<rect x="1072" y="313.0" width="10" height="10" rx="2" fill="#d1d9e0"/>
<text x="1088" y="323.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="normal" font-style="normal" text-anchor="start">30 not run</text>
<text x="1072" y="348.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#59636e" font-weight="600" font-style="normal" text-anchor="start" letter-spacing="0.4">94% of the 50 tests run</text>
<text x="640.0" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" font-weight="normal" font-style="normal" text-anchor="middle">Previews are excerpts from real runs. See the examples folder.</text>
