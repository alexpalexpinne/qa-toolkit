<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="title desc">
<title id="title">From requirement to release report</title>
<desc id="desc">Five skills in a row: review requirements, design test cases, create test data, then run the tests, report defects, and summarize results. Each card shows a short excerpt of real output.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
</defs>
<text x="30" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#1f2328" font-weight="700" font-style="normal" text-anchor="start">From requirement to release report</text>
<text x="30" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#59636e" font-weight="normal" font-style="normal" text-anchor="start">Five skills for one test round. Each one asks instead of guessing.</text>
<line x1="767.5" y1="124" x2="767.5" y2="425" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="709.5" y="96" width="116" height="26" rx="13" fill="#fbefff" stroke="#8250df" stroke-width="1"/>
<text x="767.5" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8250df" font-weight="600" font-style="normal" text-anchor="middle">▶ Run the tests</text>
<path d="M767.5,425 L1150.0,425 L1150.0,404" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="895.0" y="419" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" font-style="normal" text-anchor="middle">all results</text>
<line x1="234" y1="265.0" x2="281" y2="265.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="489" y1="265.0" x2="536" y2="265.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="744" y1="265.0" x2="791" y2="265.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="999" y1="265.0" x2="1046" y2="265.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="130" width="200" height="270" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<circle cx="56" cy="156" r="11" fill="#8250df"/>
<text x="56" y="160.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" font-style="normal" text-anchor="middle">1</text>
<text x="46" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" font-weight="700" font-style="normal" text-anchor="start">Review requirements</text>
<text x="46" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8250df" font-weight="normal" font-style="normal" text-anchor="start">/review-requirements</text>
<rect x="42" y="226" width="176" height="162" rx="8" fill="#f6f8fa"/>
<text x="52" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e" font-weight="normal" font-style="italic" text-anchor="start">“The reset link should</text>
<text x="52" y="266.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e" font-weight="normal" font-style="italic" text-anchor="start">be valid for a</text>
<text x="52" y="285.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e" font-weight="normal" font-style="italic" text-anchor="start">reasonable time.”</text>
<text x="52" y="310.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="normal" font-style="normal" text-anchor="start">How long is the link</text>
<text x="52" y="329.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="normal" font-style="normal" text-anchor="start">valid, …?</text>
<rect x="50" y="341.5" width="119.0" height="19" rx="9.5" fill="#fbefff" stroke="#8250df" stroke-width="1"/>
<text x="57" y="354.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8250df" font-weight="600" font-style="normal" text-anchor="start">[TO CLARIFY: …]</text>
<rect x="285" y="130" width="200" height="270" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<circle cx="311" cy="156" r="11" fill="#8250df"/>
<text x="311" y="160.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" font-style="normal" text-anchor="middle">2</text>
<text x="301" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" font-weight="700" font-style="normal" text-anchor="start">Design test cases</text>
<text x="301" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8250df" font-weight="normal" font-style="normal" text-anchor="start">/test-cases</text>
<rect x="297" y="226" width="176" height="162" rx="8" fill="#f6f8fa"/>
<text x="307" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#59636e" font-weight="600" font-style="normal" text-anchor="start" letter-spacing="0.4">STEP 1</text>
<text x="307" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="normal" font-style="normal" text-anchor="start">Enter the voucher and</text>
<text x="307" y="281.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="normal" font-style="normal" text-anchor="start">select 'Apply'.</text>
<text x="307" y="300.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="700" font-style="normal" text-anchor="start">Total is reduced by 25%.</text>
<text x="307" y="325.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#59636e" font-weight="600" font-style="normal" text-anchor="start" letter-spacing="0.4">STEP 2</text>
<text x="307" y="340.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="normal" font-style="normal" text-anchor="start">Select 'Place order'.</text>
<rect x="305" y="346.0" width="119.0" height="19" rx="9.5" fill="#fbefff" stroke="#8250df" stroke-width="1"/>
<text x="312" y="359.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8250df" font-weight="600" font-style="normal" text-anchor="start">[TO CLARIFY: …]</text>
<rect x="540" y="130" width="200" height="270" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<circle cx="566" cy="156" r="11" fill="#8250df"/>
<text x="566" y="160.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" font-style="normal" text-anchor="middle">3</text>
<text x="556" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" font-weight="700" font-style="normal" text-anchor="start">Create test data</text>
<text x="556" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8250df" font-weight="normal" font-style="normal" text-anchor="start">/test-data</text>
<rect x="552" y="226" width="176" height="162" rx="8" fill="#f6f8fa"/>
<text x="562" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" font-weight="normal" font-style="normal" text-anchor="start">Åsa Solvind</text>
<text x="562" y="266.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" font-weight="normal" font-style="normal" text-anchor="start">Rhys O'Harper</text>
<text x="562" y="285.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" font-weight="normal" font-style="normal" text-anchor="start">…@example.org</text>
<text x="562" y="303.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" font-weight="normal" font-style="normal" text-anchor="start">+447700900000</text>
<text x="562" y="329.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#59636e" font-weight="600" font-style="normal" text-anchor="start" letter-spacing="0.4">NAME LENGTH</text>
<text x="562" y="344.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="normal" font-style="normal" text-anchor="start">0 · 1 · 50 · 51</text>
