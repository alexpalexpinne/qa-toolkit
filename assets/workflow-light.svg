<text x="811" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" font-weight="700" font-style="normal" text-anchor="start">Report defects</text>
<text x="811" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8250df" font-weight="normal" font-style="normal" text-anchor="start">/bug-report</text>
