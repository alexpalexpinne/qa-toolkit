<text x="817" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="700" font-style="normal" text-anchor="start">SPRING10 leaves total</text>
<text x="817" y="266.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="700" font-style="normal" text-anchor="start">unchanged</text>
<text x="817" y="292.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#59636e" font-weight="600" font-style="normal" text-anchor="start" letter-spacing="0.4">EXPECTED</text>
<text x="817" y="307.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" font-weight="normal" font-style="normal" text-anchor="start">45.00 EUR</text>
<text x="817" y="325.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#59636e" font-weight="600" font-style="normal" text-anchor="start" letter-spacing="0.4">ACTUAL</text>
<text x="817" y="340.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" font-weight="normal" font-style="normal" text-anchor="start">50.00 EUR</text>
<text x="817" y="359.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="normal" font-style="normal" text-anchor="start">High (suggested)</text>
